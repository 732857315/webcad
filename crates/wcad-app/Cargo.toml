[package]
name = "wcad-app"
description = "webcad application (egui/eframe) for native desktop and the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# One bin for both targets: on wasm32 wasm-bindgen turns `main` into the start function.
[[bin]]
name = "webcad"
path = "src/main.rs"

[dependencies]
wcad-math = { workspace = true }
wcad-geom2d = { workspace = true }
wcad-sketch = { workspace = true }
wcad-doc = { workspace = true }
wcad-solid = { workspace = true }
wcad-io = { workspace = true }
wcad-render = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
rfd = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rstar = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement",
  "Blob", "BlobPropertyBag", "Url", "Location", "Storage", "Node",
] }
console_error_panic_hook = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
miniz_oxide = { workspace = true }
